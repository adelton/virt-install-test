
virt-install:
  name:
    AlmaLinux 10.2:
      osinfo: almalinux10
      arch-display:
        x86_64:
          disk-url: https://repo.almalinux.org/almalinux/10.2/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2
          inventory: tests/inventory/almalinux-10-x86_64
        aarch64:
          disk-url: https://repo.almalinux.org/almalinux/10.2/cloud/aarch64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.aarch64.qcow2
          inventory: tests/inventory/almalinux-10-aarch64
          boot: &boot-hd-also-secure-boot
            uefi:
              secure-boot-check: secure-boot=yes
            hd:
              secure-boot-check: secure-boot=yes
            '':
              secure-boot-check: secure-boot=yes
            uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=yes:
              secure-boot-check: secure-boot=yes
            uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no:
              secure-boot-check: secure-boot=no
    AlmaLinux 10.2 (with TPM):
      osinfo: almalinux10
      arch-display: x86_64
      disk-url: https://repo.almalinux.org/almalinux/10.2/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2
      inventory: tests/inventory/almalinux-10-x86_64
      boot: uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=yes
      secure-boot-check: secure-boot=yes
      args: >
        --tpm default
        --memorybacking access.mode=shared
        --filesystem source=/etc,target=host-dir,driver.type=virtiofs
        --vsock cid.auto=yes

  runs-on:
    - ubuntu-26.04
    - ubuntu-26.04-arm
    - ubuntu-24.04
    - ubuntu-24.04-arm

  osinfo: linux2024

  boot:
    uefi:
      secure-boot-check: secure-boot=yes
    hd:
      secure-boot-check: secure-boot=missing
    '':
      secure-boot-check: secure-boot=missing
    uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=yes:
      secure-boot-check: secure-boot=yes
    uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no:
      secure-boot-check: secure-boot=no

  network:
    - bridge=virbr0,model=virtio

  second-machine:
    - multihost

  args:
    - >
      --memorybacking access.mode=shared
      --filesystem source=/etc,target=host-dir,driver.type=virtiofs
      --vsock cid.auto=yes
  virtiofs-test: test
  vsock-ssh-test: test

  .match-set:
    - match:
        runs-on: ubuntu-26.04
        arch-display: x86_64
      set:
        arch:
          - "-"
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-26.04
        arch-display: aarch64
      set:
        arch:
          - ""
          - aarch64
    - match:
        runs-on: ubuntu-26.04-arm
        arch-display: x86_64
      set:
        arch:
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-26.04-arm
        arch-display: aarch64
      set:
        arch:
          - "-"
          - ""
          - aarch64
    - match:
        runs-on: ubuntu-24.04
        arch-display: x86_64
      set:
        arch:
          - "-"
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-24.04
        arch-display: aarch64
      set:
        arch:
          - ""
          - aarch64
    - match:
        runs-on: ubuntu-24.04-arm
        arch-display: x86_64
      set:
        arch:
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-24.04-arm
        arch-display: aarch64
      set:
        arch:
          - "-"
          - ""
          - aarch64

  .exclude:
    - second-machine:
        - recreate
        - local-file
        - multihost
      runs-on:
        - ubuntu-26.04-arm
        - ubuntu-24.04-arm
      .no-exclude-test: true
    - second-machine:
        - recreate
        - local-file
        - multihost
      arch-display: aarch64
      .no-exclude-test: true

    - disk-url: https://repo.almalinux.org/almalinux/10.2/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2
      name: AlmaLinux 10.2
      runs-on: ubuntu-24.04-arm
      boot:
        - uefi
        - uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=yes
        - uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no
      .virsh-console-output: &almalinux-arch-exception-secure-boot |
        BdsDxe: loading Boot0001 "UEFI Misc Device" from PciRoot(0x0)/Pci(0x1,0x4)/Pci(0x0,0x0)
        BdsDxe: starting Boot0001 "UEFI Misc Device" from PciRoot(0x0)/Pci(0x1,0x4)/Pci(0x0,0x0)
        !!!! X64 Exception Type - 06(#UD - Invalid Opcode)  CPU Apic ID - 00000000 !!!!
    - disk-url: https://repo.almalinux.org/almalinux/10.2/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2
      name: AlmaLinux 10.2 (with TPM)
      runs-on: ubuntu-24.04-arm
      boot: uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=yes
      .virsh-console-output: &almalinux-arch-exception-secure-boot |
        BdsDxe: loading Boot0002 "AlmaLinux" from HD(2,GPT,5FF7AC71-CA65-44A3-B03F-AC7935F98D42,0x1000,0x64000)/\EFI\almalinux\shimx64.efi
        BdsDxe: starting Boot0002 "AlmaLinux" from HD(2,GPT,5FF7AC71-CA65-44A3-B03F-AC7935F98D42,0x1000,0x64000)/\EFI\almalinux\shimx64.efi
        !!!! X64 Exception Type - 06(#UD - Invalid Opcode)  CPU Apic ID - 00000000 !!!!
