
virt-install:
  name:
    Ubuntu 26.04:
      osinfo: ubuntu24.04
      arch-display:
        x86_64:
          disk-url:
            - https://cloud-images.ubuntu.com/releases/resolute/release-20260421/ubuntu-26.04-server-cloudimg-amd64v3.vmdk
          inventory: tests/inventory/ubuntu-26.04-amd64
          runs-on:
            ubuntu-26.04:
    Debian 13:
      osinfo: debian13
      arch-display:
        x86_64:
          disk-url: https://cloud.debian.org/images/cloud/trixie/20260518-2482/debian-13-genericcloud-amd64-20260518-2482.qcow2
          inventory: tests/inventory/debian-13-amd64
      vsock-ssh-test: no

  runs-on:
    - ubuntu-26.04

  osinfo: linux2024

  boot:
    uefi:
      secure-boot-check: secure-boot=yes
    uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no:
      secure-boot-check: secure-boot=no

  network:
    - bridge=virbr0,model=virtio

  second-machine:
    - multihost

  args:
  virtiofs-test: no
  vsock-ssh-test: no

  .match-set:
    - match:
        runs-on: ubuntu-26.04
        arch-display: x86_64
      set:
        arch:
          - "-"
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-26.04
        arch-display: aarch64
      set:
        arch:
          - ""
          - aarch64
    - match:
        runs-on: ubuntu-26.04-arm
        arch-display: x86_64
      set:
        arch:
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-26.04-arm
        arch-display: aarch64
      set:
        arch:
          - "-"
          - ""
          - aarch64
    - match:
        runs-on: ubuntu-24.04
        arch-display: x86_64
      set:
        arch:
          - "-"
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-24.04
        arch-display: aarch64
      set:
        arch:
          - ""
          - aarch64
    - match:
        runs-on: ubuntu-24.04-arm
        arch-display: x86_64
      set:
        arch:
          - ""
          - x86_64
    - match:
        runs-on: ubuntu-24.04-arm
        arch-display: aarch64
      set:
        arch:
          - "-"
          - ""
          - aarch64

  .exclude:
    - second-machine:
        - recreate
        - local-file
        - multihost
      runs-on:
        - ubuntu-26.04-arm
        - ubuntu-24.04-arm
      .no-exclude-test: true
    - second-machine:
        - recreate
        - local-file
        - multihost
      arch-display: aarch64
      .no-exclude-test: true

    - disk-url:
        - https://repo.almalinux.org/almalinux/10.2/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2
        - https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
        - https://download.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/images/Fedora-Server-Guest-Generic-44-1.7.x86_64.qcow2
        - https://cloud-images.ubuntu.com/releases/resolute/release-20260421/ubuntu-26.04-server-cloudimg-amd64v3.vmdk
        - https://cloud-images.ubuntu.com/releases/resolute/release-20260421/ubuntu-26.04-server-cloudimg-amd64v3.img
        - https://cloud-images.ubuntu.com/releases/resolute/release-20260421/ubuntu-26.04-server-cloudimg-amd64.vmdk
        - https://cloud-images.ubuntu.com/releases/resolute/release-20260421/ubuntu-26.04-server-cloudimg-amd64.img
      runs-on:
        - ubuntu-26.04
        - ubuntu-26.04-arm
      boot:
        - uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no
      .virsh-console-output: |
        BdsDxe: failed to load Boot0002 "Grub Bootloader" from Fv(7CB8BDC9-F8EB-4F34-AAEA-3EE4AF6516A1)/FvFile(B5AE312C-BC8A-43B1-9C62-EBB826DD5D07): Not Found
